services:
  db_postgres:
    container_name: agenda-db-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "AgendaRoot@2026"
      POSTGRES_DB: "retaguarda_agendamento"
    volumes:
      - agenda_postgres_data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retaguarda_agendamento"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  agenda_postgres_data:
    driver: local
