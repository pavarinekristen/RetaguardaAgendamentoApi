services:
  db_mysql:
    container_name: agenda-db-mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "AgendaRoot@2026"
      MYSQL_DATABASE: "retaguarda_agendamento"
      MYSQL_USER: "agenda_user"
      MYSQL_PASSWORD: "AgendaUser@2026"
    volumes:
      - agenda_mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pAgendaRoot@2026"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  agenda_mysql_data:
    driver: local
