# /etc/nginx/sites-available/api.clinicaideia.com.br
# Reverse proxy do Nginx para a API SparkCore (Kestrel em 127.0.0.1:5000).
#
# Ativar:
#   sudo cp nginx-api.clinicaideia.com.br.conf /etc/nginx/sites-available/api.clinicaideia.com.br
#   sudo ln -s /etc/nginx/sites-available/api.clinicaideia.com.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Depois emitir SSL (o certbot reescreve este arquivo adicionando o bloco 443):
#   sudo certbot --nginx -d api.clinicaideia.com.br

server {
    listen 80;
    server_name api.clinicaideia.com.br;

    # O snapshot de sincronizacao do WPF envia o banco inteiro; o padrao de 1m do
    # Nginx derrubaria a sync com 413. Kestrel limita em ~30m por padrao.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
