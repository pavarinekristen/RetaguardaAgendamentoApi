# Postgres de PRODUCAO na VPS (Linode).
# Diferencas para o compose local:
#   - porta publicada apenas em 127.0.0.1 (nunca expor o Postgres na internet);
#   - senha vem do arquivo .env ao lado deste compose (POSTGRES_ROOT_PASSWORD).
#
# Uso na VPS:
#   cd /opt/sparkcore/postgres
#   docker compose -f docker-compose.postgres.prod.yml up -d

services:
  db_postgres:
    container_name: agenda-db-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_ROOT_PASSWORD:?defina POSTGRES_ROOT_PASSWORD no .env}"
      POSTGRES_DB: "retaguarda_agendamento"
    volumes:
      - agenda_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retaguarda_agendamento"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  agenda_postgres_data:
    driver: local
